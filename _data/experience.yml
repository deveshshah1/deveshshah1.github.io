highlights:
  - title: "Large Spectral Model (LSM)"
    org: "Matterworks"
    description: "A multimodal foundation model for mass spectrometry, built for predictive biology tasks, ingesting MS1/MS2 spectra and text metadata. Self-supervised pretraining on 1M+ samples with 100M-point inputs, scaled with multi-GPU model parallelism."

  - title: "LSM-MS2"
    org: "Matterworks"
    description: "A transformer-based architecture for MS2 retrieval and generative lipid identification across 100K+ analytes, achieving state-of-the-art results on the MassSpecGym benchmark. Trained with a joint curriculum and contrastive learning strategy to separate structurally similar molecules."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2510.26715

  - title: "Generative AI for materials discovery"
    org: "Ford"
    description: "A closed-loop platform pairing GANs with latent space optimization and process-structure models to propose new microstructures for new polymers, using differential augmentation for training with limited data."
    links:
      - label: NeurIPS Workshop Spotlight
        url: https://openreview.net/pdf?id=Uq6zOVUlKKo

  - title: "Geometric deep learning for atomistic simulation"
    org: "Ford & UW-Madison"
    description: "Geodesic convolutions and graph neural networks over atomic structure, for both predictive and generative tasks. Applied across molecular dynamics simulations of materials and quantum mechanical (DFT) simulations of battery chemistry."

