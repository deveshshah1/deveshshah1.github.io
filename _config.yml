# ===== Minimal Mistakes starter config, pre-filled =====
# Replace "deveshshah1" everywhere below with your actual GitHub username.

theme: minimal-mistakes-jekyll
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default" # try: air, contrast, dark, dirt, neon, mint, plum, sunrise

title: "Devesh"
name: "Devesh"
description: "ML Scientist at the intersection of AI × Science"
url: "https://deveshshah1.github.io"
baseurl: ""

# Author sidebar (appears on every page)
author:
  name: "Devesh"
  bio: "Senior Machine Learning Scientist at Matterworks, building AI systems for mass spectrometry data. Background spanning ML research, automotive AI, and process engineering."
  location: "Boston, MA"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/deveshshah1"
    - label: "arXiv"
      icon: "fas fa-fw fa-scroll"
      url: "https://arxiv.org/a/deveshshah1"
    # - label: "LinkedIn"
    #   icon: "fab fa-fw fa-linkedin"
    #   url: "https://linkedin.com/in/deveshshah1"
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope"
    #   url: "mailto:you@example.com"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/deveshshah1"

# Build settings
markdown: kramdown
paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
