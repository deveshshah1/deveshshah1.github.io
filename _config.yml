remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark" # colors are further customized in assets/css/main.scss

locale: "en-US"
title: "Devesh Shah"
name: "Devesh Shah"
description: "ML Scientist at the intersection of AI × Science"
url: "https://deveshshah1.github.io"
baseurl: ""
repository: "deveshshah1/deveshshah1.github.io"
search: false
atom_feed:
  hide: true

# Author sidebar (appears on every page)
author:
  name: "Devesh Shah"
  avatar: "/assets/images/bio-photo.jpg"
  # Italic lines under the photo in the sidebar (see _includes/author-profile.html).
  # Each line can also take a `url`.
  lines:
    - text: "Machine Learning Scientist"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/deveshshah1"
    - label: "GitHub"
      icon: "fab fa-fw fa-square-github"
      url: "https://github.com/deveshshah1"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=gtrEO34AAAAJ&hl=en"
    - label: "e-Mail"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:deveshs@umich.edu"

# Build settings
markdown: kramdown

include:
  - _pages

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
